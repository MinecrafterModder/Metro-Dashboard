<!DOCTYPE html>
<html>
  <head>
    <title>Metro Dashboard</title>
    <link rel="icon" type="image/png" href="assets/metro/favicon.png">
    <meta content="Metro Dashboard" property="og:title" />
    <meta content="A W.I.P. recreation of the Xbox 360 Metro dashboard in a website." property="og:description" />
    <meta content="https://minecraftermodder.github.io/Metro-Dashboard/" property="og:url" />
    <meta content="#108710" data-react-helmet="true" name="theme-color" />
    <meta property="og:image" content="assets/metro/favicon.png" />
    <style>
      html {
        background: linear-gradient(to bottom, #444444, #AAAAAA, #CCCCCC, #999999);
      }
      body {
        margin: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      .grid {
        display: flex;
        flex-direction: column;
        gap: 5px;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .gridrow {
        display: flex;
        gap: 5px;
      }
      .gridbutton {
        background-color: #108710;
        display: flex;
        height: 125px;
        width: 175px;
        flex-direction: column;
        box-shadow: 0px 0px 0px #000000BF;
        transition: transform .2s, box-shadow .2s;
        cursor: pointer;
      }
      .gridbutton:hover {
        background: linear-gradient(to bottom right, #6EA36E 0%, #108710 50%);
        box-shadow: 0px 0px 25px #000000BF;
        z-index: 1;
        transform: scale(1.1);
      }
      .gridbutton:active {
        transform: scale(.9)
      }
      .longgridbutton {
        background-color: #108710;
        display: flex;
        height: 125px;
        width: 200px;
        flex-direction: column;
        box-shadow: 0px 0px 0px #000000BF;
        transition: transform .2s, box-shadow .2s;
        cursor: pointer;
      }
      .longgridbutton:hover {
        background: linear-gradient(to bottom right, #6EA36E 0%, #108710 50%);
        box-shadow: 0px 0px 25px #000000BF;
        z-index: 1;
        transform: scale(1.1);
      }
      .longgridbutton:active {
        transform: scale(.9)
      }
      .gridbutton img, .longgridbutton img {
        width: 40px;
        height: 40px;
        margin: auto;
      }
      .gridbutton span, .longgridbutton span {
        margin-left: 10px;
        margin-bottom: 5px;
        color: white;
        font-family: "Segoe UI";
        letter-spacing: 1px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <audio id="hover">
        <source src="assets\metro\buttonmove.wav"></source>
      </audio>
      <div class="gridrow">
        <a class="gridbutton"><img src="assets/metro/opentray.png" draggable="false"/><span>Open Tray</span></a>
        <a class="longgridbutton"><img src="assets/metro/gold.png" draggable="false"/><span>Gold</span></a>
        <a class="longgridbutton"><img src="assets/metro/gold.png" draggable="false"/><span>Gold</span></a>
        <a class="gridbutton" href="https://bing.com"><img src="assets/metro/search.png" draggable="false"/><span>Search</span></a>
      </div>
      <div class="gridrow">
        <a class="gridbutton"><img src="assets/metro/mypins.png" draggable="false"/><span>My Pins</span></a>
        <a class="longgridbutton"><img src="assets/metro/gold.png" draggable="false"/><span>Gold</span></a>
        <a class="longgridbutton"><img src="assets/metro/gold.png" draggable="false"/><span>Gold</span></a>
        <a class="gridbutton"><img src="assets/metro/needhelp.png" draggable="false"/><span>Need Help?</span></a>
      </div>
      <div class="gridrow">
        <a class="gridbutton"><img src="assets/metro/recent.png" draggable="false"/><span>Recent</span></a>
        <a class="longgridbutton"><img src="assets/metro/moviestv.png" draggable="false"/><span>Movies & TV</span></a>
        <a class="longgridbutton"><img src="assets/metro/myapps.png" draggable="false"/><span>My Apps</span></a>
        <a class="gridbutton"><img src="assets/metro/mygames.png" draggable="false"/><span>My Games</span></a>
      </div>
    </div>
  </body>
</html>
